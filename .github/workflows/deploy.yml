name: Deploy to Yandex Object Storage

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "yandex-object-storage"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_STATIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STATIC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      AWS_EC2_METADATA_DISABLED: "true"
      YC_BUCKET: vershina50.ru
      YC_ENDPOINT: https://storage.yandexcloud.net
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/check-release.mjs
      - name: Upload site
        run: >-
          aws s3 sync dist/ "s3://${YC_BUCKET}"
          --endpoint-url "${YC_ENDPOINT}"
          --delete
          --only-show-errors
      - name: Disable browser caching for entry and service files
        shell: bash
        run: |
          while IFS= read -r file; do
            if [ -f "dist/${file}" ]; then
              aws s3 cp "dist/${file}" "s3://${YC_BUCKET}/${file}" \
                --endpoint-url "${YC_ENDPOINT}" \
                --cache-control "no-cache, no-store, must-revalidate" \
                --content-type "$(file --brief --mime-type "dist/${file}")" \
                --only-show-errors
            fi
          done <<'FILES'
          index.html
          privacy.html
          total/index.html
          robots.txt
          sitemap.xml
          site.webmanifest
          FILES
